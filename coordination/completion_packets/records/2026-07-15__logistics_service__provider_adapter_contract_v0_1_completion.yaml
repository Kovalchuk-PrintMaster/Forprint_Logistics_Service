summary: Completed the provider-neutral Logistics Service adapter contract foundation with typed validation,
  shipment preview, tracking, capability discovery, delivery quote reservation, normalized provider errors,
  a safe local registry, four synthetic provider classes, a preview-only workflow and compact structured
  check reporting. No provider API calls, real credentials or live shipment writes were added.
implemented:
- Added provider-neutral operations, capabilities and deterministic capability discovery.
- Added typed recipient validation, address validation, shipment preview, tracking and future delivery
  quote contracts.
- Added a stable dry-run envelope with schema, operation, correlation, normalized input, payload preview,
  warnings, errors and safety flags.
- Added normalized provider errors with safe messages, retryability and sensitive-value protection.
- Refined the existing ProviderAdapter as the single authoritative adapter hierarchy.
- Kept create_shipment final and disabled for every adapter.
- Added a local ProviderRegistry with duplicate rejection, deterministic lookup, disabled-provider handling
  and capability filtering.
- Added synthetic parcel, postal, freight and taxi/courier provider classes.
- Added provider-contract-check and provider-contract-preview workflows.
- Corrected local-model boundary scan scope without weakening local service and storage protection.
- Aligned compact/full check reporting with JSON, Markdown and per-check diagnostics.
- Added architecture, testing and recovery documentation.
- Added the provider-adapter operator runbook.
- Added the provider-adapter recovery guide.
- Added module-validate as a non-recursive composition of existing validation, governance, cleanup and
  status targets.
- Recorded exact pytest collection, pass and focused provider-test evidence.
