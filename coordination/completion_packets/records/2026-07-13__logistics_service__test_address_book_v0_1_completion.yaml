summary: Completed the local non-canonical Logistics Service test address book foundation. The module
  now supports synthetic address book entries, recipient aliases, lookup by recipient reference, alias,
  display name, safe search token and optional location hint, shipment-time address snapshots, and creation
  of preview-only shipment drafts without provider API calls. Committed examples contain no real customer
  or private recipient data, and live provider writes remain disabled.
implemented:
- Added the non-canonical AddressBookEntry domain model with synthetic-data, logistics-reference and ownership
  safety invariants.
- Added recipient aliases, safe search tokens and optional city and area lookup hints.
- Added AddressBookService lookup by entry ID, recipient reference, alias, display name and safe token.
- Added shipment-time AddressSnapshot creation from a local address book entry.
- Extended LogisticsRepository and InMemoryLogisticsRepository with address book save, get, list and search
  behavior.
- Added three committed synthetic address book examples for a Kyiv/local recipient, warehouse-like recipient
  and office-like recipient.
- Added an address-book-to-shipment-draft workflow that creates a preview-only draft without provider
  calls.
- Added human-readable test address book preview and dedicated validation commands.
- Added test address book visibility to the Make-first workflow and the consolidated check report.
- Documented the address book ownership boundary, alias semantics, shipment-time snapshots and future
  consumer references.
- Documented and enforced the Git-ignored local owner path runtime/address_book/owner_recipients.yaml.
- Added automated tests and policy checks preventing real customer data, credentials, live provider writes
  and forbidden ownership.
- 'Implementation checkpoints: 7270fc2, 6801f23 and 259f847.'
