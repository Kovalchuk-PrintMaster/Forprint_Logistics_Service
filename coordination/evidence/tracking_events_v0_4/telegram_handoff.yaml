event_type_coverage: 6/6
field_ownership:
  logistics_service: canonical event identity, safe lifecycle facts, priority, correlation and idempotency
  telegram_bot: wording, localization, chat/session state, buttons, transport, retries and delivery receipts
  recipient_reference: optional routing hint; not canonical client/account ownership
version_compatibility:
  supported_projection_version: logistics_notification_projection_v0_1
  unsupported_version_behavior: reject before channel rendering/delivery; no state mutation
idempotency:
  same_event_and_recipient_hint: same notification_key, idempotency_key and deterministic JSON
  notification_replay_stable: true
error_behavior:
  duplicate_or_rejected_event: no new notification projection
  unsupported_version: reject without channel delivery
safety:
  preview_only: true
  live_write: false
  provider_call_performed: false
  Telegram_API_call: false
  cross_repository_write: false
  credentials_added: false
